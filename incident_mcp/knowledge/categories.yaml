# Incident categories and the keywords that point to them.
#
# How classification works:
#   - Each keyword is matched as a whole word or phrase (case-insensitive, plural "s"/"es" allowed),
#     so "cpu" does not match inside "occupy".
#   - The weights of all matching keywords are added up per category.
#   - The category with the highest score wins. A tie goes to the category listed first in this file.
#   - No match at all means category "Other".
#
# Tune accuracy by adding keywords or changing weights here; no code change is needed.
# "plain" is a non-technical name used in executive summaries.

